<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --border: #262c36;
      --accent: #ff0055;
      --accent-hover: #ff2a70;
      --text: #f0f3f8;
      --text-secondary: #8b949e;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .input-box {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
    }

    .status-panel {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .media-info {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .thumbnail {
      width: 120px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .details {
      flex: 1;
      overflow: hidden;
    }

    .details h3 {
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .details p {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--success);
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    .download-btn:hover {
      background: #00c865;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>MP3 Downloader Pro</h1>
      <p>Convert and extract high-quality audio from YouTube videos</p>
    </header>

    <div class="input-box">
      <input type="text" id="urlInput" placeholder="Paste YouTube link here..." autocomplete="off">
      <button id="convertBtn">Convert</button>
    </div>

    <div class="settings-grid">
      <div class="select-group">
        <label for="quality">Audio Bitrate</label>
        <select id="quality">
          <option value="320">320 kbps (Best)</option>
          <option value="256">256 kbps (High)</option>
          <option value="192" selected>192 kbps (Standard)</option>
          <option value="128">128 kbps (Compact)</option>
        </select>
      </div>
      <div class="select-group">
        <label for="format">Audio Format</label>
        <select id="format">
          <option value="mp3">MP3</option>
          <option value="m4a">M4A</option>
          <option value="wav">WAV</option>
          <option value="opus">OPUS</option>
        </select>
      </div>
    </div>

    <div id="error" class="error-msg"></div>

    <div id="statusPanel" class="status-panel">
      <div class="media-info">
        <img id="thumb" class="thumbnail" src="" alt="Thumbnail">
        <div class="details">
          <h3 id="videoTitle">Processing Media...</h3>
          <p id="videoMeta">Duration: --:--</p>
        </div>
      </div>

      <div class="progress-bar">
        <div id="progress" class="progress-fill"></div>
      </div>

      <audio id="audioPreview" controls style="display: none;"></audio>

      <a id="downloadLink" href="#" target="_blank" class="download-btn" style="display: none;">
        Download File
      </a>
    </div>
  </div>

  <script>
    const convertBtn = document.getElementById('convertBtn');
    const urlInput = document.getElementById('urlInput');
    const statusPanel = document.getElementById('statusPanel');
    const progress = document.getElementById('progress');
    const thumb = document.getElementById('thumb');
    const videoTitle = document.getElementById('videoTitle');
    const videoMeta = document.getElementById('videoMeta');
    const audioPreview = document.getElementById('audioPreview');
    const downloadLink = document.getElementById('downloadLink');
    const error = document.getElementById('error');

    function extractVideoID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function showError(msg) {
      error.innerText = msg;
      error.style.display = 'block';
      convertBtn.disabled = false;
      convertBtn.innerHTML = 'Convert';
    }

    function resetUI() {
      error.style.display = 'none';
      statusPanel.style.display = 'none';
      audioPreview.style.display = 'none';
      downloadLink.style.display = 'none';
      progress.style.width = '0%';
    }

    async function processConversion() {
      resetUI();
      const url = urlInput.value.trim();
      const videoId = extractVideoID(url);

      if (!videoId) {
        showError('Please enter a valid YouTube URL.');
        return;
      }

      convertBtn.disabled = true;
      convertBtn.innerHTML = '<span class="spinner"></span> Parsing...';

      thumb.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      videoTitle.innerText = "Extracting media metadata...";
      videoMeta.innerText = "Target Quality: " + document.getElementById('quality').value + " kbps";
      statusPanel.style.display = 'block';
      
      progress.style.width = '30%';

      try {
        const quality = document.getElementById('quality').value;
        const format = document.getElementById('format').value;

        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: url,
            audioFormat: format,
            audioBitrate: quality,
            isAudioOnly: true
          })
        });

        progress.style.width = '70%';

        if (!response.ok) {
          throw new Error('Conversion pipeline failed.');
        }

        const data = await response.json();

        if (data.status === 'stream' || data.status === 'redirect') {
          const streamUrl = data.url;
          
          progress.style.width = '100%';
          videoTitle.innerText = "Audio Extracted Successfully";
          
          audioPreview.src = streamUrl;
          audioPreview.style.display = 'block';

          downloadLink.href = streamUrl;
          downloadLink.setAttribute('download', `audio.${format}`);
          downloadLink.style.display = 'flex';

          convertBtn.disabled = false;
          convertBtn.innerHTML = 'Convert';
        } else {
          throw new Error('Unable to resolve audio stream source.');
        }

      } catch (err) {
        showError('Failed to fetch audio stream. Please check connection or try another URL.');
        statusPanel.style.display = 'none';
      }
    }

    convertBtn.addEventListener('click', processConversion);
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') processConversion();
    });
  </script>
</body>
</html>
