<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  
  <link rel="icon" type="image/png" href="arts/iconYT.png">
  <link rel="apple-touch-icon" href="arts/iconYT.png">
  <meta name="theme-color" content="#0b0e14">

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151921;
      --border: #232936;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .install-bar {
      display: none;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .install-bar span {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .install-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .select-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .status-card {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
    }

    .media-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .thumb-preview {
      width: 128px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .media-info {
      flex: 1;
      overflow: hidden;
    }

    .media-info h3 {
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .media-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      height: 40px;
    }

    .download-action {
      display: none;
      width: 100%;
      padding: 12px;
      background: var(--success);
      color: #000;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .download-action:hover {
      opacity: 0.9;
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      text-align: center;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid var(--accent);
      color: #ff6b6b;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
      .input-group {
        flex-direction: column;
      }
      button {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="arts/iconYT.png" alt="App Icon" class="app-icon">
      <h1>MP3 Extractor</h1>
      <p>High-speed YouTube audio extraction app</p>
    </header>

    <div id="installBar" class="install-bar">
      <span>Install app on your device</span>
      <button id="pwaInstallBtn" class="install-btn">Install</button>
    </div>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste YouTube link (e.g. https://youtu.be/...)" autocomplete="off">
      <button id="processBtn">Extract Audio</button>
    </div>

    <div class="controls-grid">
      <div class="select-box">
        <label for="bitrate">Bitrate</label>
        <select id="bitrate">
          <option value="320">320 kbps (HQ)</option>
          <option value="256">256 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="128">128 kbps</option>
        </select>
      </div>

      <div class="select-box">
        <label for="format">Container</label>
        <select id="format">
          <option value="mp3">MP3</option>
          <option value="m4a">M4A</option>
          <option value="opus">OPUS</option>
          <option value="wav">WAV</option>
        </select>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="statusCard" class="status-card">
      <div class="media-header">
        <img id="thumbImg" class="thumb-preview" src="" alt="Thumbnail">
        <div class="media-info">
          <h3 id="mediaTitle">Parsing target media...</h3>
          <p id="mediaDetails">Status: Initializing extraction</p>
        </div>
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <audio id="audioElement" controls style="display: none;"></audio>

      <a id="downloadBtn" class="download-action" href="#" target="_blank" download>
        Save Audio File
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    let deferredPrompt;
    const installBar = document.getElementById('installBar');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.style.display = 'flex';
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBar.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    const processBtn = document.getElementById('processBtn');
    const urlInput = document.getElementById('urlInput');
    const alertBox = document.getElementById('alertBox');
    const statusCard = document.getElementById('statusCard');
    const progressFill = document.getElementById('progressFill');
    const thumbImg = document.getElementById('thumbImg');
    const mediaTitle = document.getElementById('mediaTitle');
    const mediaDetails = document.getElementById('mediaDetails');
    const audioElement = document.getElementById('audioElement');
    const downloadBtn = document.getElementById('downloadBtn');

    function parseYouTubeID(url) {
      const pattern = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?.*v=|embed\/|v\/|shorts\/)|youtu\.be\/)([\w-]{11})/;
      const match = url.match(pattern);
      return match ? match[1] : null;
    }

    function displayError(message) {
      alertBox.innerText = message;
      alertBox.style.display = 'block';
      processBtn.disabled = false;
      processBtn.innerHTML = 'Extract Audio';
    }

    function resetState() {
      alertBox.style.display = 'none';
      statusCard.style.display = 'none';
      audioElement.style.display = 'none';
      downloadBtn.style.display = 'none';
      progressFill.style.width = '0%';
    }

    async function executeExtraction() {
      resetState();
      const rawUrl = urlInput.value.trim();
      const videoId = parseYouTubeID(rawUrl);

      if (!videoId) {
        displayError('Invalid YouTube URL format provided.');
        return;
      }

      processBtn.disabled = true;
      processBtn.innerHTML = '<div class="spinner"></div> Resolving...';

      thumbImg.src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      mediaTitle.innerText = `YouTube ID: ${videoId}`;
      mediaDetails.innerText = 'Connecting to extraction engine...';
      statusCard.style.display = 'block';
      progressFill.style.width = '25%';

      const selectedBitrate = document.getElementById('bitrate').value;
      const selectedFormat = document.getElementById('format').value;

      try {
        progressFill.style.width = '50%';
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: `https://www.youtube.com/watch?v=${videoId}`,
            audioFormat: selectedFormat,
            audioBitrate: selectedBitrate,
            isAudioOnly: true
          })
        });

        if (!response.ok) throw new Error('Primary engine returned error status.');
        const result = await response.json();

        if (result.status === 'stream' || result.status === 'redirect') {
          const streamUrl = result.url;
          progressFill.style.width = '100%';
          mediaDetails.innerText = `Format: ${selectedFormat.toUpperCase()} | Target Bitrate: ${selectedBitrate}kbps`;

          audioElement.src = streamUrl;
          audioElement.style.display = 'block';

          downloadBtn.href = streamUrl;
          downloadBtn.setAttribute('download', `${videoId}.${selectedFormat}`);
          downloadBtn.style.display = 'block';

          processBtn.disabled = false;
          processBtn.innerHTML = 'Extract Audio';
        } else {
          throw new Error('Pipeline error: Unresolvable stream payload.');
        }

      } catch (err) {
        statusCard.style.display = 'none';
        displayError(`Extraction failed: ${err.message}`);
      }
    }

    processBtn.addEventListener('click', executeExtraction);
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeExtraction();
    });
  </script>
</body>
</html>
