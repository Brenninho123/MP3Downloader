<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3Downloader</title>

  <link rel="icon" type="image/png" href="arts/iconYT.png">
  <link rel="apple-touch-icon" href="arts/iconYT.png">
  <meta name="theme-color" content="#ffd700">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-main: #0a0b0d;
      --bg-card: #121418;
      --bg-input: #1a1d24;
      --bg-raised: #1e2129;
      --border: #2a2e38;
      --yellow-primary: #ffd700;
      --yellow-hover: #ffea00;
      --yellow-subtle: rgba(255, 215, 0, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-border: #ef4444;
      --error-text: #fca5a5;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-border: #22c55e;
      --success-text: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 14px;
      border-radius: 16px;
      border: 2px solid var(--yellow-primary);
      padding: 4px;
      background: var(--bg-main);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--yellow-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .install-bar {
      display: none;
      background: var(--yellow-subtle);
      border: 1px solid var(--yellow-primary);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 24px;
      align-items: center;
      justify-content: space-between;
    }

    .install-bar span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--yellow-primary);
    }

    .install-btn {
      background: var(--yellow-primary);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--yellow-primary);
    }

    button.icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--yellow-primary);
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button.process-btn {
      background: var(--yellow-primary);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 0 28px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button.process-btn:hover {
      background: var(--yellow-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .option-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-box label {
      font-size: 0.8rem;
      color: var(--yellow-primary);
      letter-spacing: 0.4px;
      font-weight: 700;
    }

    select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }

    .alert {
      display: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      text-align: center;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .status-card {
      display: none;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      margin-top: 20px;
    }

    .media-info {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .media-thumb {
      width: 120px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .media-details {
      flex: 1;
      overflow: hidden;
    }

    .media-details h3 {
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .media-details p {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--yellow-subtle);
      border: 1px solid var(--yellow-primary);
      color: var(--yellow-primary);
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--yellow-primary);
      transition: width 0.3s ease;
    }

    .stage-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    audio {
      width: 100%;
      margin-bottom: 18px;
      height: 42px;
    }

    .action-row {
      display: flex;
      gap: 12px;
    }

    .download-btn {
      flex: 2;
      padding: 14px;
      background: var(--yellow-primary);
      color: #000;
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .thumb-btn {
      flex: 1;
      padding: 14px;
      background: var(--bg-main);
      border: 1px solid var(--yellow-primary);
      color: var(--yellow-primary);
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .history-section {
      margin-top: 28px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h2 {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .history-header button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }

    .history-item img {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .history-item .info {
      flex: 1;
      overflow: hidden;
    }

    .history-item .info p {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item .info span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .history-item button {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--yellow-primary);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-history {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 16px 0;
    }

    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
      .input-section { flex-direction: column; }
      .action-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="arts/iconYT.png" alt="App Icon" class="app-icon" onerror="this.style.display='none'">
      <h1>MP3Downloader</h1>
      <p>Multi-engine audio extractor for YouTube and direct streams</p>
    </header>

    <div id="installBar" class="install-bar">
      <span>Install App on Device</span>
      <button id="pwaInstallBtn" class="install-btn">Install</button>
    </div>

    <div class="input-section">
      <input type="text" id="urlInput" placeholder="Paste any YouTube link, video ID, or direct audio URL" autocomplete="off">
      <button id="pasteBtn" class="icon-btn" type="button">Paste</button>
      <button id="processBtn" class="process-btn">Extract Audio</button>
    </div>

    <div class="options-grid">
      <div class="option-box">
        <label for="format">Target format</label>
        <select id="format">
          <option value="mp3">MP3 (universal)</option>
          <option value="m4a">M4A (AAC)</option>
          <option value="opus">OPUS</option>
          <option value="wav">WAV</option>
          <option value="flac">FLAC</option>
        </select>
      </div>

      <div class="option-box">
        <label for="bitrate">Bitrate quality</label>
        <select id="bitrate">
          <option value="320">320 kbps (highest)</option>
          <option value="256">256 kbps</option>
          <option value="192" selected>192 kbps</option>
          <option value="128">128 kbps</option>
          <option value="96">96 kbps (smallest)</option>
        </select>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="statusCard" class="status-card">
      <div class="media-info">
        <img id="mediaThumb" class="media-thumb" src="" alt="Thumbnail">
        <div class="media-details">
          <h3 id="mediaTitle">Detecting audio source...</h3>
          <p id="mediaChannel"></p>
          <span id="typeBadge" class="badge">INITIALIZING</span>
        </div>
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="stageLabel" class="stage-label"></div>

      <audio id="audioElement" controls style="display: none;"></audio>

      <div class="action-row">
        <a id="downloadBtn" class="download-btn" href="#" target="_blank" download style="display: none;">
          Download Audio
        </a>
        <a id="thumbBtn" class="thumb-btn" href="#" target="_blank" download style="display: none;">
          Thumbnail
        </a>
      </div>
    </div>

    <div class="history-section">
      <div class="history-header">
        <h2>Recent extractions</h2>
        <button id="clearHistoryBtn" type="button">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    let deferredPrompt;
    const installBar = document.getElementById('installBar');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.style.display = 'flex';
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') installBar.style.display = 'none';
        deferredPrompt = null;
      }
    });

    const processBtn = document.getElementById('processBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const urlInput = document.getElementById('urlInput');
    const alertBox = document.getElementById('alertBox');
    const statusCard = document.getElementById('statusCard');
    const progressFill = document.getElementById('progressFill');
    const stageLabel = document.getElementById('stageLabel');
    const mediaThumb = document.getElementById('mediaThumb');
    const mediaTitle = document.getElementById('mediaTitle');
    const mediaChannel = document.getElementById('mediaChannel');
    const typeBadge = document.getElementById('typeBadge');
    const audioElement = document.getElementById('audioElement');
    const downloadBtn = document.getElementById('downloadBtn');
    const thumbBtn = document.getElementById('thumbBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    const ENGINE_APIS = [
      'https://api.cobalt.tools/api/json',
      'https://cobalt.api.scrapes.pro/api/json',
      'https://dwnld.nichind.dev/api/json'
    ];

    const INVIDIOUS_MIRRORS = [
      'https://inv.riverside.rocks',
      'https://invidious.nerdvpn.de',
      'https://vid.puffyan.us',
      'https://yt.artemislena.eu',
      'https://invidious.jing.rocks'
    ];

    const HISTORY_KEY = 'mp3downloader_history';
    const MAX_HISTORY = 8;

    function extractYouTubeId(rawUrl) {
      const trimmed = rawUrl.trim();
      if (/^[\w-]{11}$/.test(trimmed)) return trimmed;

      const patterns = [
        /(?:https?:\/\/)?(?:[\w-]+\.)?youtube(?:-nocookie)?\.com\/watch\?(?:[^#]*&)?v=([\w-]{11})/i,
        /(?:https?:\/\/)?(?:[\w-]+\.)?youtube(?:-nocookie)?\.com\/(?:embed|v|shorts|live)\/([\w-]{11})/i,
        /(?:https?:\/\/)?youtu\.be\/([\w-]{11})/i,
        /(?:https?:\/\/)?(?:[\w-]+\.)?youtube\.com\/attribution_link.*[?&]v=([\w-]{11})/i,
        /(?:https?:\/\/)?(?:[\w-]+\.)?youtube\.com\/oembed\?url=.*v%3D([\w-]{11})/i
      ];

      for (const pattern of patterns) {
        const match = trimmed.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    function isDirectAudioUrl(url) {
      return /\.(mp3|wav|m4a|ogg|opus|flac)(\?.*)?$/i.test(url);
    }

    function showError(msg) {
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      resetButton();
    }

    function resetButton() {
      processBtn.disabled = false;
      processBtn.innerHTML = 'Extract Audio';
    }

    function resetState() {
      alertBox.style.display = 'none';
      statusCard.style.display = 'none';
      audioElement.style.display = 'none';
      downloadBtn.style.display = 'none';
      thumbBtn.style.display = 'none';
      progressFill.style.width = '0%';
      stageLabel.innerText = '';
      mediaChannel.innerText = '';
    }

    function setStage(percent, label) {
      progressFill.style.width = percent + '%';
      stageLabel.innerText = label;
    }

    async function fetchYouTubeMeta(ytId) {
      try {
        const oembedUrl = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`;
        const res = await fetch(oembedUrl, { signal: AbortSignal.timeout(5000) });
        if (!res.ok) return null;
        const data = await res.json();
        return { title: data.title, author: data.author_name };
      } catch (e) {
        return null;
      }
    }

    async function processCobaltEngine(targetUrl, format, bitrate) {
      for (const endpoint of ENGINE_APIS) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              url: targetUrl,
              audioFormat: format,
              audioBitrate: bitrate,
              isAudioOnly: true
            }),
            signal: AbortSignal.timeout(8000)
          });

          if (!res.ok) continue;
          const data = await res.json();
          if (data.status === 'stream' || data.status === 'redirect') {
            return data.url;
          }
          if (data.status === 'tunnel' && data.url) {
            return data.url;
          }
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    async function processInvidiousFallback(ytId) {
      for (const mirror of INVIDIOUS_MIRRORS) {
        try {
          const res = await fetch(`${mirror}/api/v1/videos/${ytId}`, { signal: AbortSignal.timeout(6000) });
          if (!res.ok) continue;
          const data = await res.json();
          if (data && data.adaptiveFormats) {
            const audioTracks = data.adaptiveFormats.filter(f => f.type && f.type.includes('audio'));
            if (audioTracks.length) {
              audioTracks.sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
              return { url: audioTracks[0].url, title: data.title, author: data.author };
            }
          }
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveToHistory(entry) {
      const items = loadHistory();
      items.unshift(entry);
      const trimmed = items.slice(0, MAX_HISTORY);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
      renderHistory();
    }

    function renderHistory() {
      const items = loadHistory();
      historyList.innerHTML = '';

      if (!items.length) {
        historyList.innerHTML = '<div class="empty-history">No extractions yet.</div>';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const img = document.createElement('img');
        img.src = item.thumb || 'arts/iconYT.png';
        img.alt = '';

        const info = document.createElement('div');
        info.className = 'info';
        const titleEl = document.createElement('p');
        titleEl.innerText = item.title;
        const metaEl = document.createElement('span');
        metaEl.innerText = `${item.format.toUpperCase()} · ${item.bitrate} kbps`;
        info.appendChild(titleEl);
        info.appendChild(metaEl);

        const openBtn = document.createElement('button');
        openBtn.innerText = 'Open';
        openBtn.type = 'button';
        openBtn.addEventListener('click', () => {
          urlInput.value = item.sourceUrl;
          handleExtraction();
        });

        row.appendChild(img);
        row.appendChild(info);
        row.appendChild(openBtn);
        historyList.appendChild(row);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    });

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) urlInput.value = text.trim();
      } catch (e) {
        showError('Clipboard access was blocked by the browser.');
      }
    });

    async function handleExtraction() {
      resetState();
      const inputUrl = urlInput.value.trim();

      if (!inputUrl) {
        showError('Please enter a media URL.');
        return;
      }

      processBtn.disabled = true;
      processBtn.innerHTML = '<div class="spinner"></div> Extracting...';
      statusCard.style.display = 'block';
      setStage(15, 'Reading the link');

      const selectedFormat = document.getElementById('format').value;
      const selectedBitrate = document.getElementById('bitrate').value;

      const ytId = extractYouTubeId(inputUrl);

      if (isDirectAudioUrl(inputUrl) && !ytId) {
        typeBadge.innerText = 'DIRECT AUDIO';
        mediaTitle.innerText = 'Direct Media Stream';
        mediaThumb.src = 'arts/iconYT.png';
        setStage(100, 'Ready');

        audioElement.src = inputUrl;
        audioElement.style.display = 'block';

        downloadBtn.href = inputUrl;
        downloadBtn.style.display = 'block';

        saveToHistory({
          title: 'Direct Media Stream',
          thumb: 'arts/iconYT.png',
          format: selectedFormat,
          bitrate: selectedBitrate,
          sourceUrl: inputUrl
        });

        resetButton();
        return;
      }

      if (!ytId) {
        showError('This link could not be recognized as a YouTube video or a direct audio file.');
        statusCard.style.display = 'none';
        return;
      }

      typeBadge.innerText = 'YOUTUBE MEDIA';
      mediaThumb.src = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
      thumbBtn.href = `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
      thumbBtn.style.display = 'block';

      setStage(30, 'Fetching video details');
      const meta = await fetchYouTubeMeta(ytId);
      if (meta) {
        mediaTitle.innerText = meta.title;
        mediaChannel.innerText = meta.author || '';
      } else {
        mediaTitle.innerText = `YouTube video ${ytId}`;
      }

      setStage(55, 'Contacting audio engines');

      try {
        let finalStreamUrl = await processCobaltEngine(inputUrl, selectedFormat, selectedBitrate);

        if (!finalStreamUrl) {
          setStage(75, 'Trying fallback nodes');
          typeBadge.innerText = 'FALLBACK NODE';
          const fallbackData = await processInvidiousFallback(ytId);
          if (fallbackData) {
            finalStreamUrl = fallbackData.url;
            if (!meta) {
              mediaTitle.innerText = fallbackData.title || mediaTitle.innerText;
              mediaChannel.innerText = fallbackData.author || '';
            }
          }
        }

        if (!finalStreamUrl) {
          throw new Error('All audio nodes failed to process this link. Try again in a moment.');
        }

        setStage(100, 'Ready');

        audioElement.src = finalStreamUrl;
        audioElement.style.display = 'block';

        downloadBtn.href = finalStreamUrl;
        downloadBtn.setAttribute('download', `${mediaTitle.innerText}.${selectedFormat}`);
        downloadBtn.style.display = 'block';

        saveToHistory({
          title: mediaTitle.innerText,
          thumb: mediaThumb.src,
          format: selectedFormat,
          bitrate: selectedBitrate,
          sourceUrl: inputUrl
        });

        resetButton();

      } catch (err) {
        statusCard.style.display = 'none';
        showError(err.message || 'Failed to establish audio connection.');
      }
    }

    processBtn.addEventListener('click', handleExtraction);
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleExtraction();
    });

    renderHistory();
  </script>
</body>
</html>
