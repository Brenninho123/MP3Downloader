<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter Pro</title>
  
  <link rel="icon" type="image/png" href="arts/iconYT.png">
  <link rel="apple-touch-icon" href="arts/iconYT.png">
  <meta name="theme-color" content="#0b0e14">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151921;
      --border: #232936;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --secondary: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .install-bar {
      display: none;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .install-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .select-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .status-card {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
    }

    .media-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .thumb-preview {
      width: 128px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border);
    }

    .media-info {
      flex: 1;
      overflow: hidden;
    }

    .media-info h3 {
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .media-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      height: 40px;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .download-action {
      flex: 1;
      padding: 12px;
      background: var(--success);
      color: #000;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .thumb-action {
      padding: 12px 18px;
      background: var(--secondary);
      color: #fff;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      text-align: center;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid var(--accent);
      color: #ff6b6b;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .controls-grid { grid-template-columns: 1fr; }
      .input-group { flex-direction: column; }
      .action-group { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="arts/iconYT.png" alt="App Icon" class="app-icon">
      <h1>MP3 Extractor Pro</h1>
      <p>High-performance YouTube audio & thumbnail downloader</p>
    </header>

    <div id="installBar" class="install-bar">
      <span>Install app on your device</span>
      <button id="pwaInstallBtn" class="install-btn">Install</button>
    </div>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste YouTube link (e.g. https://youtu.be/...)" autocomplete="off">
      <button id="processBtn">Extract Audio</button>
    </div>

    <div class="controls-grid">
      <div class="select-box">
        <label for="format">Preferred Audio Format</label>
        <select id="format">
          <option value="mp3">MP3 / AAC</option>
          <option value="m4a">M4A</option>
          <option value="opus">OPUS</option>
        </select>
      </div>

      <div class="select-box">
        <label for="quality">Audio Quality Target</label>
        <select id="quality">
          <option value="high">Best Available</option>
          <option value="medium">Medium</option>
        </select>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div id="statusCard" class="status-card">
      <div class="media-header">
        <img id="thumbImg" class="thumb-preview" src="" alt="Thumbnail">
        <div class="media-info">
          <h3 id="mediaTitle">Parsing video stream...</h3>
          <p id="mediaDetails">Status: Processing audio pipeline</p>
        </div>
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <audio id="audioElement" controls style="display: none;"></audio>

      <div class="action-group">
        <a id="downloadBtn" class="download-action" href="#" target="_blank" download style="display: none;">
          Download Audio
        </a>
        <a id="thumbBtn" class="thumb-action" href="#" target="_blank" download style="display: none;">
          Get Thumbnail
        </a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    let deferredPrompt;
    const installBar = document.getElementById('installBar');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBar.style.display = 'flex';
    });

    pwaInstallBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBar.style.display = 'none';
        deferredPrompt = null;
      }
    });

    const processBtn = document.getElementById('processBtn');
    const urlInput = document.getElementById('urlInput');
    const alertBox = document.getElementById('alertBox');
    const statusCard = document.getElementById('statusCard');
    const progressFill = document.getElementById('progressFill');
    const thumbImg = document.getElementById('thumbImg');
    const mediaTitle = document.getElementById('mediaTitle');
    const mediaDetails = document.getElementById('mediaDetails');
    const audioElement = document.getElementById('audioElement');
    const downloadBtn = document.getElementById('downloadBtn');
    const thumbBtn = document.getElementById('thumbBtn');

    const INVIDIOUS_NODES = [
      'https://inv.riverside.rocks',
      'https://invidious.nerdvpn.de',
      'https://invidious.drgns.space',
      'https://vid.puffyan.us'
    ];

    function parseYouTubeID(url) {
      const pattern = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?.*v=|embed\/|v\/|shorts\/)|youtu\.be\/)([\w-]{11})/;
      const match = url.match(pattern);
      return match ? match[1] : null;
    }

    function displayError(msg) {
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      processBtn.disabled = false;
      processBtn.innerHTML = 'Extract Audio';
    }

    function resetState() {
      alertBox.style.display = 'none';
      statusCard.style.display = 'none';
      audioElement.style.display = 'none';
      downloadBtn.style.display = 'none';
      thumbBtn.style.display = 'none';
      progressFill.style.width = '0%';
    }

    async function fetchStreamWithFallback(videoId) {
      for (const node of INVIDIOUS_NODES) {
        try {
          const res = await fetch(`${node}/api/v1/videos/${videoId}`, { signal: AbortSignal.timeout(5000) });
          if (!res.ok) continue;
          const data = await res.json();
          if (data && data.adaptiveFormats) {
            const audioStreams = data.adaptiveFormats.filter(item => item.type && item.type.includes('audio'));
            if (audioStreams.length > 0) {
              return {
                title: data.title || videoId,
                streamUrl: audioStreams[0].url
              };
            }
          }
        } catch (e) {
          continue;
        }
      }
      throw new Error('All primary extraction nodes are busy. Try again in a few moments.');
    }

    async function executeExtraction() {
      resetState();
      const rawUrl = urlInput.value.trim();
      const videoId = parseYouTubeID(rawUrl);

      if (!videoId) {
        displayError('Invalid YouTube URL. Please check the link structure.');
        return;
      }

      processBtn.disabled = true;
      processBtn.innerHTML = '<div class="spinner"></div> Processing...';

      const thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      thumbImg.src = thumbUrl;
      mediaTitle.innerText = `Resolving YouTube ID: ${videoId}`;
      mediaDetails.innerText = 'Connecting to fallback proxy network...';
      statusCard.style.display = 'block';
      progressFill.style.width = '35%';

      thumbBtn.href = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
      thumbBtn.style.display = 'block';

      try {
        progressFill.style.width = '65%';
        const result = await fetchStreamWithFallback(videoId);

        progressFill.style.width = '100%';
        mediaTitle.innerText = result.title;
        mediaDetails.innerText = 'Audio stream extracted successfully.';

        audioElement.src = result.streamUrl;
        audioElement.style.display = 'block';

        downloadBtn.href = result.streamUrl;
        downloadBtn.setAttribute('download', `${result.title}.mp3`);
        downloadBtn.style.display = 'block';

        processBtn.disabled = false;
        processBtn.innerHTML = 'Extract Audio';

      } catch (err) {
        statusCard.style.display = 'none';
        displayError(err.message);
      }
    }

    processBtn.addEventListener('click', executeExtraction);
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeExtraction();
    });
  </script>
</body>
</html>
